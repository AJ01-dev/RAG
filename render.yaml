services:
  - type: web
    name: rag-document-intelligence-api
    runtime: python
    plan: free
    region: oregon
    rootDir: server
    buildCommand: pip install -r requirements.txt && python -c "from chromadb.utils import embedding_functions; embedding_functions.ONNXMiniLM_L6_V2()"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: HOST
        value: 0.0.0.0
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: WEB_CONCURRENCY
        value: "1"
